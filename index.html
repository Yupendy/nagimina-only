<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナギみなオンリータイトル総選挙</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9dfc9;color:#3f3a32;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 50px}
h1{font-size:22px;font-weight:600;margin:0 0 8px}
.sub{font-size:14px;color:#777;line-height:1.75;margin-bottom:24px}
.card{background:#fffdf8;border-radius:18px;padding:22px;box-shadow:0 3px 18px #0000000b}
.progress{height:5px;background:#ddd2bc;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar{height:100%;width:0;background:#d2aa43;transition:.2s}
.q{font-size:14px;color:#777;margin:0 0 14px;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:145px;border:1px solid #ddd6ca;background:#fff;border-radius:15px;padding:18px 14px;font-size:17px;line-height:1.55;cursor:pointer;transition:.15s}
.choice:hover{transform:translateY(-2px);border-color:#c6a35b;box-shadow:0 5px 16px #00000010}
.actions{display:flex;justify-content:center;margin-top:16px}
.back{border:0;background:none;color:#888;font-size:13px;cursor:pointer}
.back:disabled{color:#ccc;cursor:default}
.result{display:none}
.result h2{font-size:21px;text-align:center;margin:0 0 8px}
.result p{text-align:center;color:#777;font-size:14px;line-height:1.7}
.top{margin:22px 0}
.row{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid #eee}
.num{font-size:20px;width:28px;text-align:center;color:#c29a39;font-weight:600}
.name{font-size:16px;line-height:1.45}
.primary{width:100%;border:0;border-radius:12px;padding:14px;background:#333;color:white;font-size:15px;margin-top:10px}
.note{font-size:12px;color:#999;line-height:1.6;margin-top:14px}
.restart{display:block;margin:18px auto 0;border:0;background:none;color:#777;text-decoration:underline}
@media(max-width:520px){.choices{grid-template-columns:1fr}.choice{min-height:105px}}
</style>
</head>
<body>
<div class="wrap">
<div id="sort">
<h1>ナギみなオンリータイトル総選挙</h1>
<div class="sub">なんと24個も候補をいただきましたのでTOP3ソートを作成しました。オンリータイトル候補で「より好き」と思う方を選んでください。TOP3が決まった時点で終了し、結果を反映させた投票ページへご案内します（後ほど手動で変更可能）。深く考えず、直感でどうぞ！</div>
<div class="card">
<div class="progress"><div class="bar" id="bar"></div></div>
<p class="q" id="q">どちらがお好きですか？</p>
<div class="choices">
<button class="choice" id="a"></button>
<button class="choice" id="b"></button>
</div>
<div class="actions"><button class="back" id="back" disabled>一手前に戻る</button></div>
</div>
</div>
<div class="card result" id="result">
<h2>あなたのナギみなオンリータイトルTOP3</h2>
<p>比較の結果、あなたが特に好きだった候補はこちらです。</p>
<div class="top" id="top"></div>
<button class="primary" id="openForm">この3つで投票する</button>
<div class="note">TOP3のタイトルが選択された状態で投票ページを開きます。手動での選択変更も可能です。</div>
<button class="restart" id="restart">もう一度挑戦する</button>
</div>
</div>
<script>
const candidates = ["渚に揺らめく水面とあなた","凪の水面に過ぎゆく春が","繋ぎとめよう、惜しみない愛を","春を待つふたり","凪いでる振りしてヘビーな恋を！","恋の暗号は北のプリンスと蛇しか知らない","十六夜の日になつめく恋を","波が穏やかになること","幸せなギフトをみな様に","NAGIMINA IN BLOOM","ノスメ航空臨時便","桜凪ぐ波打ち際","凪と波のあいだ","北の王子様に薔薇を","NAGIMINA, NORTHBOUND","大人ぎりぎりの水無月","王子様、蛇に噛まれる","渚のギャングスター","治外法権の波打ち際にて","わがままなgive me now!","凪ゆらぎ水面が揺蕩う頃に","全部あなたのせいですよ","凪いだ水面に浮かんだ桜","渚に押し寄る恋と波"];

const PRELIM_ROUNDS=2;
const TOP_COUNT=6;
let phase="prelim", pairs=[], pairIndex=0, scores=new Array(candidates.length).fill(0);
let topCandidates=[], finalTop=[], topPairIndex=0, topScores=new Array(TOP_COUNT).fill(0);
let current=null, previousState=null;

function randomInt(max){
  if(window.crypto&&crypto.getRandomValues){
    const a=new Uint32Array(1), limit=Math.floor(0x100000000/max)*max;
    do{crypto.getRandomValues(a)}while(a[0]>=limit);
    return a[0]%max;
  }
  return Math.floor(Math.random()*max);
}
function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function savePrevious(){
  previousState={
    phase,pairs: pairs.slice(),pairIndex,scores:scores.slice(),
    topCandidates:topCandidates.slice(),finalTop:finalTop.slice(),
    topPairIndex,topScores:topScores.slice(),current:current?current.slice():null
  };
  document.getElementById("back").disabled=false;
}
function restorePrevious(){
  if(!previousState)return;
  const s=previousState;
  phase=s.phase;pairs=s.pairs.slice();pairIndex=s.pairIndex;scores=s.scores.slice();
  topCandidates=s.topCandidates.slice();finalTop=s.finalTop.slice();
  topPairIndex=s.topPairIndex;topScores=s.topScores.slice();current=s.current?s.current.slice():null;
  previousState=null;
  document.getElementById("back").disabled=true;
  document.getElementById("sort").style.display="block";
  document.getElementById("result").style.display="none";
  render();
}
function makePairs(){
  const ids=shuffle([...Array(candidates.length).keys()]);
  pairs=[];
  // Every candidate appears exactly twice in the preliminary phase.
  for(let r=0;r<PRELIM_ROUNDS;r++){
    const a=shuffle(ids);
    for(let i=0;i<a.length;i+=2)pairs.push([a[i],a[i+1]]);
  }
  pairIndex=0;
}
function start(){
  phase="prelim";makePairs();next();
}
function next(){
  if(phase==="prelim"){
    if(pairIndex>=pairs.length){selectTop();return}
    current=pairs[pairIndex];
  }else{
    if(topPairIndex>=topPairs.length){finish();return}
    current=topPairs[topPairIndex];
  }
  render();
}
function selectTop(){
  const ranked=[...Array(candidates.length).keys()].sort((a,b)=>scores[b]-scores[a]||randomInt(2)-1);
  topCandidates=ranked.slice(0,TOP_COUNT);
  topPairs=[];
  for(let i=0;i<topCandidates.length;i++)
    for(let j=i+1;j<topCandidates.length;j++)topPairs.push([topCandidates[i],topCandidates[j]]);
  topPairs=shuffle(topPairs);
  topPairIndex=0;topScores=new Array(TOP_COUNT).fill(0);phase="top";next();
}
let topPairs=[];
function choose(which){
  if(!current)return;
  savePrevious();
  const winner=current[which];
  if(phase==="prelim"){
    scores[winner]++;
    pairIndex++;
  }else{
    const idx=topCandidates.indexOf(winner);
    if(idx>=0)topScores[idx]++;
    topPairIndex++;
  }
  next();
}
function finish(){
  const order=topCandidates.slice().sort((a,b)=>{
    const sa=topScores[topCandidates.indexOf(a)], sb=topScores[topCandidates.indexOf(b)];
    return sb-sa || scores[b]-scores[a] || randomInt(2)-1;
  });
  finalTop=order.slice(0,3);
  document.getElementById("sort").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("top").innerHTML=finalTop.map((x,i)=>
    `<div class="row"><div class="num">${i+1}</div><div class="name">${esc(candidates[x])}</div></div>`).join("");
  document.getElementById("bar").style.width="100%";
}
function render(){
  if(!current)return;
  document.getElementById("a").textContent=candidates[current[0]];
  document.getElementById("b").textContent=candidates[current[1]];
  document.getElementById("q").textContent="どちらがお好きですか？";
  const total=phase==="prelim"?pairs.length:pairs.length+topPairs.length;
  const done=phase==="prelim"?pairIndex:pairs.length+topPairIndex;
  document.getElementById("bar").style.width=Math.min(96,done/total*100)+"%";
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

document.getElementById("a").onclick=()=>choose(0);
document.getElementById("b").onclick=()=>choose(1);
document.getElementById("back").onclick=restorePrevious;
document.getElementById("restart").onclick=()=>location.reload();
document.getElementById("openForm").onclick=()=>{
  const base="https://docs.google.com/forms/d/e/1FAIpQLSfQifzm6imaI4XfThsNBugEAuRLNyEEYZB5z1pf2yOcrmgiVw/viewform?usp=pp_url";
  const entry="entry.1497568293";
  location.href=base+"&"+finalTop.map(i=>entry+"="+encodeURIComponent(candidates[i])).join("&");
};
start();
</script>
</body></html>
