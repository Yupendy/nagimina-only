<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナギみなオンリー名｜好きな3つを見つけよう</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9dfc9;color:#3f3a32;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 50px}
h1{font-size:22px;font-weight:600;margin:0 0 8px}
.sub{font-size:14px;color:#777;line-height:1.7;margin-bottom:24px}
.card{background:#fffdf8;border-radius:18px;padding:22px;box-shadow:0 3px 18px #0000000b}
.progress{height:5px;background:#ddd2bc;border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar{height:100%;width:0;background:#d2aa43;transition:.25s}
.q{font-size:14px;color:#777;margin:0 0 14px;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:145px;border:1px solid #ddd6ca;background:#fff;border-radius:15px;padding:18px 14px;font-size:17px;line-height:1.55;cursor:pointer;transition:.15s}
.choice:hover{transform:translateY(-2px);border-color:#c6a35b;box-shadow:0 5px 16px #00000010}
.choice:active{transform:translateY(0)}
.skip{display:block;margin:16px auto 0;border:0;background:none;color:#999;font-size:13px;cursor:pointer}
.result{display:none}
.result h2{font-size:21px;text-align:center;margin:0 0 8px}
.result p{text-align:center;color:#777;font-size:14px;line-height:1.7}
.top{margin:22px 0}
.row{display:flex;align-items:center;gap:12px;padding:13px 8px;border-bottom:1px solid #eee}
.num{font-size:20px;width:28px;text-align:center;color:#c29a39;font-weight:600}
.name{font-size:16px;line-height:1.45}
.vote{margin-top:20px}
.vote h3{font-size:16px;margin:0 0 8px}
.vote label{display:block;padding:10px 0;font-size:15px}
button.primary{width:100%;border:0;border-radius:12px;padding:14px;background:#333;color:white;font-size:15px;margin-top:10px}
.note{font-size:12px;color:#999;line-height:1.6;margin-top:14px}
.restart{display:block;margin:18px auto 0;border:0;background:none;color:#777;text-decoration:underline}
@media(max-width:520px){.choices{grid-template-columns:1fr}.choice{min-height:105px}}
</style>
</head>
<body>
<div class="wrap">
  <div id="sort">
    <h1>ナギみなオンリータイトル総選挙</h1>
    <div class="sub">候補を2つずつ比べて、「より好き」と思う方を選んでください。TOP3が決まった時点で終了します。深く考えず、直感でどうぞ。</div>
    <div class="card">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <p class="q" id="q">どちらが好き？</p>
      <div class="choices">
        <button class="choice" id="a">渚に揺らめく水面とあなた</button>
        <button class="choice" id="b">凪の水面に過ぎゆく春が</button>
      </div>
      <button class="skip" id="skip">どちらも決めにくい</button>
    </div>
  </div>

  <div class="card result" id="result">
    <h2>あなたのTOP3</h2>
    <p>比較の結果、あなたが特に好きだった候補はこちらです。</p>
    <div class="top" id="top"></div>
    <div class="vote">
      <h3>この3つの中から、最終的に一番推したいものを1つ選ぶ</h3>
      <div id="voteOptions"></div>
      <button class="primary" id="openForm">この3つで投票する</button>
      <div class="note">TOP3が選択された状態でGoogleフォームを開きます。内容を確認して、そのまま送信できます。</div>
    </div>
    <button class="restart" id="restart">もう一度やる</button>
  </div>
</div>

<script>
const candidates = ["渚に揺らめく水面とあなた", "凪の水面に過ぎゆく春が", "繋ぎとめよう、惜しみない愛を", "春を待つふたり", "凪いでる振りしてヘビーな恋を！", "恋の暗号は北のプリンスと蛇しか知らない", "十六夜の日になつめく恋を", "波が穏やかになること", "幸せなギフトをみな様に", "NAGIMINA IN BLOOM", "ノスメ航空臨時便", "桜凪ぐ波打ち際", "凪と波のあいだ", "北の王子様に薔薇を", "NAGIMINA, NORTHBOUND", "大人ぎりぎりの水無月", "王子様、蛇に噛まれる", "渚のギャングスター", "治外法権の波打ち際にて", "わがままなgive me now!", "凪ゆらぎ水面が揺蕩う頃に", "全部あなたのせいですよ", "凪いだ水面に浮かんだ桜", "渚に押し寄る恋と波"];

let rounds=[], currentRound=0, currentMatch=0, comparisons=0, totalMatches=0;
let finalTop=[];

function randomInt(max){
  if (window.crypto && crypto.getRandomValues) {
    const a = new Uint32Array(1);
    const limit = Math.floor(0x100000000 / max) * max;
    do { crypto.getRandomValues(a); } while (a[0] >= limit);
    return a[0] % max;
  }
  return Math.floor(Math.random() * max);
}

function shuffle(x){
  x=[...x];
  for(let i=x.length-1;i>0;i--){
    let j=randomInt(i+1);
    [x[i],x[j]]=[x[j],x[i]];
  }
  return x;
}

// Tournament method:
// 1. Find the #1 candidate.
// 2. Find #2 only among candidates that directly lost to #1.
// 3. Find #3 only among candidates that directly lost to #1 or #2.
// This avoids sorting all 24 candidates.
function makeTournament(items){
  let pool=shuffle(items).map(name=>({name, lostTo:[]}));
  let next=[];
  while(pool.length){
    if(pool.length===1){ next.push(pool.pop()); continue; }
    const a=pool.pop(), b=pool.pop();
    next.push({name:null, a, b});
  }
  return playTree(next);
}

function playTree(nodes){
  if(nodes.length===1) return nodes[0];
  let next=[];
  for(let i=0;i<nodes.length;i+=2){
    if(!nodes[i+1]) next.push(nodes[i]);
    else next.push({name:null,a:nodes[i],b:nodes[i+1]});
  }
  return playTree(next);
}

function flattenLeaves(node){
  if(node.name!==null) return [node];
  return [...flattenLeaves(node.a), ...flattenLeaves(node.b)];
}

function compareTree(node){
  if(node.name!==null) return node;
  const a=compareTree(node.a), b=compareTree(node.b);
  return {name:null,a,b};
}

function start(){
  // Build a simple tournament bracket. Each match records the loser,
  // so only the candidates capable of being #2/#3 need further comparison.
  let pool=shuffle(candidates);
  rounds=[];
  while(pool.length>1){
    let next=[];
    for(let i=0;i<pool.length;i+=2){
      if(i+1<pool.length) next.push({a:pool[i], b:pool[i+1]});
      else next.push({a:pool[i], b:null});
    }
    rounds.push(next);
    pool=next.map((_,i)=>"WINNER_"+rounds.length+"_"+i);
  }
  // We don't use the placeholder rounds directly; use a match queue instead.
  const matches=[];
  let leaves=shuffle(candidates);
  while(leaves.length>1){
    const next=[];
    for(let i=0;i<leaves.length;i+=2){
      if(leaves[i+1]){
        matches.push({a:leaves[i],b:leaves[i+1]});
        next.push(null);
      } else next.push(leaves[i]);
    }
    leaves=next;
  }
  // The bracket needs winners to be fed into later rounds dynamically.
  bracketQueue = [shuffle(candidates)];
  winners = [];
  losersByWinner = new Map();
  beginRound();
}

let bracketQueue=[], winners=[], losersByWinner=new Map();

function beginRound(){
  const pool=bracketQueue[bracketQueue.length-1];
  if(pool.length===1){
    const champion=pool[0];
    const directLosers=losersByWinner.get(champion)||[];
    findSecond(champion,directLosers);
    return;
  }
  const next=[];
  bracketCurrent={pool,index:0,next};
  nextMatch();
}

let bracketCurrent=null;

function nextMatch(){
  const {pool,index,next}=bracketCurrent;
  if(index>=pool.length){
    bracketQueue.push(next);
    beginRound();
    return;
  }
  if(index===pool.length-1){
    next.push(pool[index]);
    bracketCurrent.index++;
    nextMatch();
    return;
  }
  current=[pool[index],pool[index+1]];
  bracketCurrent.index+=2;
  render();
}

function recordWinner(winner, loser){
  if(!losersByWinner.has(winner)) losersByWinner.set(winner,[]);
  losersByWinner.get(winner).push(loser);
  bracketCurrent.next.push(winner);
  nextMatch();
}

function choose(which){
  const winner=current[which], loser=current[1-which];
  comparisons++;
  recordWinner(winner,loser);
}

function skip(){
  // "どちらも決めにくい" は同率扱いとしてランダムに通過させます。
  choose(randomInt(2));
}

let phase="champion", secondPool=[], secondWinner=null, secondIndex=0;
function findSecond(champion,pool){
  phase="second";
  secondWinner=champion;
  secondPool=shuffle([...pool]);
  if(secondPool.length===0){ finish([champion]); return; }
  runSelection(secondPool,0,champion);
}

let selectionWinner=null, selectionPool=[], selectionIndex=0, selectionBase=null;
function runSelection(pool,start,base){
  selectionPool=pool;
  selectionIndex=start;
  selectionBase=base;
  if(pool.length===0){ finish([base]); return; }
  selectionWinner=pool[0];
  selectionIndex=1;
  nextSelection();
}

function nextSelection(){
  if(selectionIndex>=selectionPool.length){
    if(phase==="second"){
      const champion=selectionBase;
      secondWinner=selectionWinner;
      const candidatesForThird=new Set();
      (losersByWinner.get(champion)||[]).forEach(x=>{if(x!==secondWinner)candidatesForThird.add(x)});
      (losersByWinner.get(secondWinner)||[]).forEach(x=>candidatesForThird.add(x));
      const thirdPool=[...candidatesForThird];
      if(thirdPool.length===0){ finish([champion,secondWinner]); return; }
      phase="third";
      runSelection(thirdPool,0,champion);
      return;
    }
    finish([selectionBase,secondWinner,selectionWinner]);
    return;
  }
  current=[selectionWinner,selectionPool[selectionIndex]];
  render();
}

function selectionChoose(which){
  const winner=current[which];
  const loser=current[1-which];
  comparisons++;
  if(which===1){
    // Keep track of the defeated candidate for the eventual third-place set.
    if(!losersByWinner.has(winner)) losersByWinner.set(winner,[]);
    losersByWinner.get(winner).push(loser);
    selectionWinner=winner;
  }
  selectionIndex++;
  nextSelection();
}

function render(){
  document.getElementById("a").textContent=current[0];
  document.getElementById("b").textContent=current[1];
  document.getElementById("q").textContent="どちらが好き？";
  const max=45;
  document.getElementById("bar").style.width=Math.min(96,comparisons/max*70)+"%";
}

document.getElementById("a").onclick=()=>{
  if(phase==="champion") choose(0);
  else selectionChoose(0);
};
document.getElementById("b").onclick=()=>{
  if(phase==="champion") choose(1);
  else selectionChoose(1);
};
document.getElementById("skip").onclick=skip;

function finish(top){
  finalTop=top.slice(0,3);
  document.getElementById("sort").style.display="none";
  document.getElementById("result").style.display="block";
  document.getElementById("top").innerHTML=finalTop.map((x,i)=>`<div class="row"><div class="num">${i+1}</div><div class="name">${esc(x)}</div></div>`).join("");
  document.getElementById("voteOptions").innerHTML=finalTop.map((x,i)=>`<label><input type="radio" name="vote" value="${escAttr(x)}"> ${esc(x)}</label>`).join("");
  window.finalTop=finalTop;
  document.getElementById("bar").style.width="100%";
}

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escAttr(s){return s.replace(/"/g,"&quot;")}

document.getElementById("restart").onclick=()=>location.reload();
document.getElementById("openForm").onclick=()=>{
  const base="https://docs.google.com/forms/d/e/1FAIpQLSfQifzm6imaI4XfThsNBugEAuRLNyEEYZB5z1pf2yOcrmgiVw/viewform?usp=pp_url";
  const entry="entry.1497568293";
  const params=finalTop.map(x=>entry+"="+encodeURIComponent(x)).join("&");
  window.location.href=base+"&"+params;
};

start();
</script>
</body>
</html>
